name: Deploy map viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate map image from VoxelMap data
        run: pnpm --filter voxelmap-to-image run map

      - name: Embed map into the shared map-render package
        run: pnpm --filter map-render run generate-map

      - name: Fetch POIs from the database
        run: pnpm --filter map-render run fetch-pois
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Build Astro app
        run: pnpm --filter voxelmap-viewer run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/voxelmap-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
