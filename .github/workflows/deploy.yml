name: Deploy map viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate map image from VoxelMap data
        run: pnpm --filter voxelmap-to-image run map

      - name: Embed map into the shared map-render package
        run: pnpm --filter map-render run generate-map

      - name: Fetch POIs from the database
        run: pnpm --filter map-render run fetch-pois
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Build Astro app
        run: pnpm --filter voxelmap-viewer run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/voxelmap-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  deploy-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate map image from VoxelMap data
        run: pnpm --filter voxelmap-to-image run map

      - name: Embed map into the shared map-render package
        run: pnpm --filter map-render run generate-map

      - name: Fetch POIs from the database
        run: pnpm --filter map-render run fetch-pois
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      # `vercel deploy` accepts VERCEL_ORG_ID/VERCEL_PROJECT_ID env vars directly,
      # but `vercel env` doesn't — it only reads a local .vercel/project.json link
      # file, which a fresh CI checkout never has. Write it explicitly so both
      # this step and the deploy step below resolve the same linked project.
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s","projectName":"voxelmap-admin"}' "${{ secrets.VERCEL_PROJECT_ID }}" "${{ secrets.VERCEL_ORG_ID }}" > .vercel/project.json
          cat .vercel/project.json

      # GitHub secrets are the source of truth; sync them to Vercel's persistent
      # project env vars (not deploy-time --env flags, which don't reliably
      # survive Vercel reusing a build cache across deployments) so the deployed
      # function always has what requireEnv() expects on every request.
      - name: Sync env vars to Vercel
        run: |
          sync_env() {
            name="$1"
            value="$2"
            pnpm dlx vercel@latest env rm "$name" production --yes --token="${{ secrets.VERCEL_TOKEN }}" >/dev/null 2>&1 || true
            printf '%s' "$value" | pnpm dlx vercel@latest env add "$name" production --token="${{ secrets.VERCEL_TOKEN }}"
          }
          sync_env MONGODB_URI "${{ secrets.MONGODB_URI }}"
          sync_env BETTER_AUTH_SECRET "${{ secrets.BETTER_AUTH_SECRET }}"
          sync_env BETTER_AUTH_URL "${{ secrets.BETTER_AUTH_URL }}"
          sync_env GITHUB_TOKEN "${{ secrets.ADMIN_GITHUB_TOKEN }}"
          sync_env GITHUB_REPO "alexandremottet/maxthox-zevent-minez"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Root Directory (apps/voxelmap-admin) is configured on the Vercel project
      # itself, so this uploads the whole checked-out workspace (pnpm-lock.yaml,
      # the map-render package, and the just-refreshed map/POI data included) and
      # Vercel builds inside that subdirectory.
      - name: Deploy admin to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
