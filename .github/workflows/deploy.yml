name: Deploy map viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate map image from VoxelMap data
        run: pnpm --filter voxelmap-to-image run map
        env:
          VOXELMAP_PRUNE_RADIUS: "10"

      - name: Embed map into the shared map-render package
        run: pnpm --filter map-render run generate-map

      - name: Fetch POIs from the database
        run: pnpm --filter map-render run fetch-pois
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download BlueMap CLI
        run: |
          mkdir -p packages/voxelmap-to-image/bluemap-cli
          curl -fL -o packages/voxelmap-to-image/bluemap-cli/bluemap-5.23-cli.jar \
            https://github.com/BlueMap-Minecraft/BlueMap/releases/download/v5.23/bluemap-5.23-cli.jar

      - name: Render BlueMap
        run: pnpm --filter voxelmap-to-image run bluemap
        env:
          BLUEMAP_PRUNE_RADIUS: "10"
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Build Astro app
        run: pnpm --filter voxelmap-viewer run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/voxelmap-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

